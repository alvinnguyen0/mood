{{define "title"}}sign up{{end}}
{{define "content"}}
<section class="auth">
  <h1>create your account</h1>
  {{if .Error}}<p class="err">{{.Error}}</p>{{end}}
  <form method="post" action="/signup" class="authform">
    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
    <label>email
      <input type="email" name="email" autocomplete="email" required autofocus>
    </label>
    <label>password
      <input type="password" name="password" autocomplete="new-password" minlength="8" required>
    </label>
    <p class="hint">at least 8 characters.</p>
    <input type="hidden" name="tz" id="tz" value="UTC">
    <button type="submit">sign up</button>
  </form>
  <p class="alt">already have an account? <a href="/login">log in</a></p>
</section>
<script>
  // Capture the browser's timezone so "today" is computed in the user's local time.
  try {
    document.getElementById('tz').value =
      Intl.DateTimeFormat().resolvedOptions().timeZone || 'UTC';
  } catch (e) { /* keep UTC */ }
</script>
{{end}}
