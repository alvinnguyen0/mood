{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{block "title" .}}mood{{end}} · logmood</title>
<link rel="stylesheet" href="/static/style.css">
<script>
  (function(){var t=localStorage.getItem('theme')||'light';document.documentElement.setAttribute('data-theme',t);})();
</script>
<script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
<header class="nav">
  <div class="brand"><span class="brand-log">log</span><span class="brand-mood">mood</span></div>
  <nav class="tabs">
    <a href="/everyone" class="{{if eq .Tab "everyone"}}active{{end}}">everyone</a>
    <a href="/you" class="{{if eq .Tab "you"}}active{{end}}">you</a>
  </nav>
  <div class="nav-right">
    {{if .LoggedIn}}
    <form method="post" action="/logout" class="logout"><input type="hidden" name="csrf_token" value="{{.CSRFToken}}"><button type="submit">log out</button></form>
    {{end}}
    <button id="theme-toggle" class="theme-toggle" aria-label="toggle theme"></button>
  </div>
</header>

<main>
{{block "content" .}}{{end}}
</main>

<div id="tip" class="tip" hidden></div>
<script src="/static/app.js" defer></script>
</body>
</html>{{end}}
