name: Deploy

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.DROPLET_PORT || 22 }}
          # Fail fast on a hung handshake instead of waiting the default 30m.
          timeout: 60s
          # Allow the build/restart to take a while once connected.
          command_timeout: 20m
          # Abort (and surface a non-zero exit) on the first failed command.
          script_stop: true
          script: |
            set -eu
            REPO="${HOME}/mood"
            # Clone on first deploy; otherwise hard-reset to origin/main so a
            # drifted working tree can't make `git pull` fail mid-deploy.
            if [ ! -d "${REPO}/.git" ]; then
              git clone https://github.com/alvinnguyen0/mood.git "${REPO}"
            fi
            cd "${REPO}"
            git fetch origin main
            git reset --hard origin/main
            docker compose build --no-cache
            docker compose up -d
            docker image prune -f
